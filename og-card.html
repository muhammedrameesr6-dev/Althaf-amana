<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, height=630">
<title>Althaf &amp; Amana — Wedding Invitation Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital@0;1&family=Cinzel:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 1200px;
  height: 630px;
  background: radial-gradient(ellipse at 50% 50%, #1c1512 0%, #0c0908 100%);
  color: #FAF6EE;
  font-family: 'Cinzel', serif;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.outer-border {
  position: absolute;
  inset: 22px;
  border: 1px solid rgba(212, 175, 55, 0.45);
  pointer-events: none;
}
.inner-border {
  position: absolute;
  inset: 30px;
  border: 1px solid rgba(212, 175, 55, 0.22);
  pointer-events: none;
}
.corner-accent {
  position: absolute;
  width: 18px;
  height: 18px;
  border-color: #D4AF37;
  pointer-events: none;
}
.corner-tl { top: 22px; left: 22px; border-top: 2px solid; border-left: 2px solid; }
.corner-tr { top: 22px; right: 22px; border-top: 2px solid; border-right: 2px solid; }
.corner-bl { bottom: 22px; left: 22px; border-bottom: 2px solid; border-left: 2px solid; }
.corner-br { bottom: 22px; right: 22px; border-bottom: 2px solid; border-right: 2px solid; }

.card {
  width: 100%;
  height: 100%;
  display: flex;
  padding: 44px 64px;
  z-index: 2;
}
.left-col {
  flex: 1.18;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding-right: 42px;
}
.bismillah {
  font-family: 'Amiri', serif;
  font-size: 27px;
  color: #D4AF37;
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.eyebrow {
  font-size: 12px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: #C5A059;
  margin-bottom: 14px;
  font-weight: 500;
}
.names {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 56px;
  font-weight: 600;
  color: #FAF6EE;
  line-height: 1.12;
  margin-bottom: 14px;
  letter-spacing: 0.02em;
  text-shadow: 0 2px 24px rgba(212, 175, 55, 0.35);
}
.amp {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  color: #D4AF37;
  font-size: 0.72em;
  font-weight: 400;
  display: block;
  margin: 0;
}
.divider {
  width: 160px;
  height: 1px;
  background: linear-gradient(90deg, transparent, #D4AF37, transparent);
  margin-bottom: 16px;
}
.date-highlight {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #FAF6EE;
  margin-bottom: 5px;
  font-weight: 500;
}
.hijri {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: 0.15em;
  color: #C5A059;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.events-box {
  background: rgba(212, 175, 55, 0.06);
  border: 1px solid rgba(212, 175, 55, 0.25);
  border-radius: 4px;
  padding: 12px 24px;
  width: 100%;
  max-width: 440px;
}
.event-line {
  font-family: 'Lora', serif;
  font-size: 13.5px;
  color: #E8E0D5;
  line-height: 1.6;
}
.event-line strong {
  color: #D4AF37;
  font-family: 'Cinzel', serif;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.event-sep {
  height: 1px;
  background: rgba(212, 175, 55, 0.2);
  margin: 6px 0;
}

.right-col {
  flex: 0.82;
  display: flex;
  align-items: center;
  justify-content: center;
}
.img-frame {
  width: 100%;
  height: 480px;
  border: 1px solid rgba(212, 175, 55, 0.45);
  box-shadow: 0 0 35px rgba(0,0,0,0.85), inset 0 0 30px rgba(0,0,0,0.5);
  background: url('rashid.png') center/cover no-repeat;
  position: relative;
  border-radius: 2px;
}
.img-frame::after {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(212, 175, 55, 0.2);
  pointer-events: none;
}
</style>
</head>
<body>
<div class="outer-border"></div>
<div class="inner-border"></div>
<div class="corner-accent corner-tl"></div>
<div class="corner-accent corner-tr"></div>
<div class="corner-accent corner-bl"></div>
<div class="corner-accent corner-br"></div>
<div class="card">
  <div class="left-col">
    <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
    <div class="eyebrow">Wedding Invitation</div>
    <div class="names">Althaf<span class="amp">&amp;</span>Fathimathul Amana</div>
    <div class="divider"></div>
    <div class="date-highlight">Sunday · 13 December 2026</div>
    <div class="hijri">04 Rajab 1448 AH · Kannur &amp; Kasaragod</div>
    <div class="events-box">
      <div class="event-line">
        <strong>Reception:</strong> Madai Bank Auditorium, Pazhayangadi
      </div>
      <div class="event-sep"></div>
      <div class="event-line">
        <strong>Nikah:</strong> Udinur Juma Masjid, Trikaripur (12 Dec)
      </div>
    </div>
  </div>
  <div class="right-col">
    <div class="img-frame"></div>
  </div>
</div>
</body>
</html>
